[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimo-agent"
version = "0.1.0"
description = "NIMO personal computer-agent foundation"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
browser = [
  "playwright>=1.50",
]
vision = [
  "pytesseract>=0.3.13",
]
computer = [
  "mss>=9.0",
  "pyautogui>=0.9",
  "Pillow>=10.0",
  "pygetwindow>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"


[tool.setuptools.packages.find]
where = ["."]
include = [
  "agent*", "app*", "automation*", "browser*", "computer*", "github*",
  "integrations*", "knowledge*", "learning*", "memory*", "models*",
  "security*", "tools*", "ui*", "voice*"
]
